name: Release

# A pull request into master builds the store package and attaches it to the run,
# so the exact artefact can be tested before it is merged. Merging that pull
# request publishes it as a GitHub release.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the tag check below can see existing tags.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release metadata
        id: meta
        run: |
          npm run release:check
          echo "version=$(node scripts/check-release.mjs --version)" >> "$GITHUB_OUTPUT"

      - name: Refuse to reuse a released version
        run: |
          version="${{ steps.meta.outputs.version }}"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already tagged. Bump the version and add a CHANGELOG entry."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Test
        run: npm test --if-present

      - name: Build and pack
        run: npm run pack

      - name: Smoke test the built service worker
        run: npm run smoke

      - name: Name the package after the version
        run: mv save-link-to-notion.zip "save-link-to-notion-v${{ steps.meta.outputs.version }}.zip"

      - name: Write release notes
        run: node scripts/check-release.mjs --notes-file release-notes.md

      - name: Upload the store package
        uses: actions/upload-artifact@v5
        with:
          name: save-link-to-notion-v${{ steps.meta.outputs.version }}
          path: |
            save-link-to-notion-v${{ steps.meta.outputs.version }}.zip
            release-notes.md
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    # Only once the change is actually on master.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the store package
        uses: actions/download-artifact@v5
        with:
          name: save-link-to-notion-v${{ needs.package.outputs.version }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            "save-link-to-notion-v$VERSION.zip#Chrome Web Store package (v$VERSION)"
          echo "Released v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Upload the attached zip in the Chrome Web Store dashboard." >> "$GITHUB_STEP_SUMMARY"
